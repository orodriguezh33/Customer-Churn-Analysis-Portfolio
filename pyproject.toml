    { name = "Oscar Rodriguez", email = "orodriguezh33@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-databricks>=1.12.4",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "nbconvert>=7.17.1",
    "numpy>=2.5.2",
